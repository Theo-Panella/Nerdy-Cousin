services:
  rabbitmq:
    image: rabbitmq:management-alpine
  
    ports:
    # Porta AQMP
     - "5672:5672"
    # Porta HTTP
     - "80:15672"

    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=123

  testing-machine:

    build: .

    volumes:
      - .:/app  

      
networks:
  public:
    driver: bridge